name: Leandec PR 5461 validation
on:
  push:
    branches: [validation/leandec-pr-5461]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      HUSKY: "0"
      TURBO_CACHE: "local:rw"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - name: Format source and export exact formatted files
        run: |
          npx --no-install oxfmt src/leandec src/doctorRuntime.ts src/domain/doctorProviderIds.ts src/composition/binary.ts docs/.vitepress/documentation.ts docs/providers/leandec-provider.md docs/README.md scripts/lib/module-layers.mjs
          node --input-type=module -e 'import {execFileSync} from "node:child_process"; import {readFileSync} from "node:fs"; for (const p of execFileSync("git",["diff","--name-only"],{encoding:"utf8"}).trim().split("\n").filter(Boolean)) {const b=readFileSync(p).toString("base64"); for(let i=0;i<b.length;i+=3000) console.log("FORMAT_BLOB "+p+" "+i+" "+b.slice(i,i+3000))}'
      - name: Leandec regression tests
        run: npm run test:local -- src/leandec/LeandecProvider.test.ts src/leandec/LeandecMcpClient.test.ts src/leandec/LeandecSessionClient.test.ts
      - name: TypeScript compilation
        if: success() || failure()
        run: npm run typecheck
      - name: Architecture guards and lint
        if: success() || failure()
        run: npm run check:fast
      - name: Module boundaries
        if: success() || failure()
        run: npm run verify:module-boundaries
      - name: Format
        if: success() || failure()
        run: npx --no-install oxfmt --check src/leandec src/doctorRuntime.ts src/domain/doctorProviderIds.ts src/composition/binary.ts docs/.vitepress/documentation.ts docs/providers/leandec-provider.md docs/README.md scripts/lib/module-layers.mjs
