name: Leandec PR 5461 validation
on:
  push:
    branches: [validation/leandec-pr-5461]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      HUSKY: "0"
      TURBO_CACHE: "local:rw"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - name: Leandec regression tests
        run: npm run test:local -- src/leandec/LeandecProvider.test.ts src/leandec/LeandecMcpClient.test.ts
      - name: TypeScript compilation
        if: success() || failure()
        run: npm run typecheck
      - name: Architecture guards and lint
        if: success() || failure()
        run: npm run check:fast
      - name: Format
        if: success() || failure()
        run: npx --no-install oxfmt --check src/leandec src/doctorRuntime.ts src/domain/doctorProviderIds.ts src/composition/binary.ts docs/.vitepress/documentation.ts docs/leandec-provider.md
